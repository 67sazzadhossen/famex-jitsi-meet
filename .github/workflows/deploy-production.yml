name: Deploy production frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: fame-meet-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    if: vars.PRODUCTION_AUTO_DEPLOY == 'true'
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: |
          WEBPACK_LOW_MEMORY=1 NODE_OPTIONS=--max-old-space-size=6144 \
            ./node_modules/.bin/webpack --progress --parallelism 1
          make deploy

      - name: Package and checksum deployment
        run: deployment/build-web-artifact.sh "$RUNNER_TEMP/fame-meet-${GITHUB_SHA}.tar.gz"

      - name: Stage artifact locally
        run: |
          install -m 0600 \
            "$RUNNER_TEMP/fame-meet-${GITHUB_SHA}.tar.gz" \
            "/home/fameit/fame-meet-deploy/incoming/${GITHUB_SHA}.tar.gz"

      - name: Deploy with backup and health check
        run: >-
          sudo -n /usr/local/sbin/fame-meet-deploy
          "/home/fameit/fame-meet-deploy/incoming/${GITHUB_SHA}.tar.gz"
          "${GITHUB_SHA}"
