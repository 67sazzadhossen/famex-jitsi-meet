name: Deploy production frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: fame-meet-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build frontend
    if: vars.PRODUCTION_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: make

      - name: Package and checksum deployment
        run: deployment/build-web-artifact.sh "$RUNNER_TEMP/fame-meet-${GITHUB_SHA}.tar.gz"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fame-meet-web-${{ github.sha }}
          path: ${{ runner.temp }}/fame-meet-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy frontend
    needs: build
    runs-on: [self-hosted, linux, x64, production]
    environment: production
    timeout-minutes: 10

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fame-meet-web-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Stage artifact locally
        run: |
          install -m 0600 \
            "$RUNNER_TEMP/fame-meet-${GITHUB_SHA}.tar.gz" \
            "/home/fameit/fame-meet-deploy/incoming/${GITHUB_SHA}.tar.gz"

      - name: Deploy with backup and health check
        run: >-
          sudo -n /usr/local/sbin/fame-meet-deploy
          "/home/fameit/fame-meet-deploy/incoming/${GITHUB_SHA}.tar.gz"
          "${GITHUB_SHA}"
